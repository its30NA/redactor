name: Missed secret
description: Redactor left a secret in the output.
labels: ["detection"]
body:
  - type: markdown
    attributes:
      value: |
        **Never paste a real secret, key or password here.** This page is public. Replace the secret with a
        made-up value of the same shape (same length, same kind of characters, same text around it) and check
        that the made-up version is still missed.
  - type: textarea
    id: input
    attributes:
      label: Input with a made-up secret
      description: The smallest text that still shows the miss.
      render: text
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What was left in the output
      description: Which part of the text should have been redacted?
    validations:
      required: true
  - type: input
    id: how
    attributes:
      label: How you ran it
      description: The app or `scrub`, the sensitivity level, and any config you use.
      placeholder: scrub --sensitivity balanced app.log
  - type: input
    id: version
    attributes:
      label: Version
      description: The output of `scrub --version`, or the version shown in the app.
