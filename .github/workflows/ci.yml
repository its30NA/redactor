name: CI

on:
  push:
    branches: [main, v2]
  pull_request:

# CI needs no secrets and only reads the repository.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  linux:
    name: Rust (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Toolchain
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Test (includes the corpus gates)
        run: cargo test --workspace --locked
      - name: Install cargo-deny
        run: cargo install --locked --version 0.20.2 cargo-deny
      - name: Dependency policy (Windows graph, includes the Tauri shell)
        run: cargo deny check
      - name: Dependency policy (Linux, scrub)
        run: cargo deny --exclude redactor-app --target x86_64-unknown-linux-gnu check
      - name: Dependency policy (macOS, scrub)
        run: cargo deny --exclude redactor-app --target aarch64-apple-darwin check

  windows:
    name: Rust (Windows)
    runs-on: windows-latest
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: app/ui/package-lock.json
      - name: Toolchain
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      # The Tauri context macro embeds the built UI, so the app crate needs app/ui/dist to compile.
      - name: Build the UI
        working-directory: app/ui
        run: |
          npm ci --no-audit --no-fund
          npm run build
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      # The #[ignore] clipboard tests stay ignored: they need a desktop session.
      - name: Test
        run: cargo test --workspace --locked

  ui:
    name: UI (Svelte)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: app/ui
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: app/ui/package-lock.json
      - name: Install
        run: npm ci --no-audit --no-fund
      # The notices list every crate and npm package that ships: they need the cargo sources
      # (cargo fetch) and node_modules (npm ci above). Fails when the committed file is stale.
      - name: Toolchain (third-party notices)
        working-directory: .
        run: rustup show active-toolchain || rustup toolchain install
      - name: Third-party notices are up to date
        working-directory: .
        run: |
          cargo fetch --locked
          tools/gen-notices.sh
          git diff --exit-code THIRD_PARTY_NOTICES.md
      - name: Typecheck
        run: npm run check
      - name: Lint
        run: npm run lint
      - name: Unit tests
        run: npm test
      # No `--with-deps`: the ubuntu-24.04 image already carries Chrome's libraries, and the UI
      # embeds its fonts. Skipping apt keeps a mirror outage from blocking CI (2026-11-11).
      - name: Install Chromium
        run: npx playwright install chromium
      # The config's CI reporter is `github` only; add the HTML report for the failure artifact.
      - name: Playwright (mocked IPC)
        env:
          PLAYWRIGHT_HTML_OPEN: never
        run: npm run test:e2e -- --reporter=github,html
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: |
            app/ui/playwright-report/
            app/ui/test-results/
          if-no-files-found: ignore
          retention-days: 7
