name: Release

# Releases are built here and nowhere else: never upload a local build (it embeds local paths).
# A tag v* produces a DRAFT release with every artifact, SHA256SUMS and build provenance
# attestations. Publishing the draft is a manual step.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  TAG: ${{ github.ref_name }}
  # Keep the runner's checkout path out of the binaries.
  RUSTFLAGS: --remap-path-prefix=${{ github.workspace }}=/build

# No build cache is restored or saved in this workflow: release builds start from a clean slate,
# so a cache written by another ref cannot influence what ships.
jobs:
  preflight:
    name: Preflight
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Tag is on main
        run: git merge-base --is-ancestor "$GITHUB_SHA" origin/main
      - name: Tag matches the versions in the tree
        run: tools/release/check-version.sh "$TAG"
      - name: CHANGELOG has a section for this version
        run: tools/release/changelog-section.sh "$TAG" > /dev/null
      - name: Toolchain
        run: rustup show active-toolchain || rustup toolchain install
      - name: Tests (Rust workspace)
        run: cargo test --workspace --locked

  app-windows:
    name: Windows app
    needs: preflight
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      - name: Toolchain
        run: rustup show active-toolchain || rustup toolchain install
      - name: Build the UI
        working-directory: app/ui
        run: |
          npm ci --no-audit --no-fund
          npm run build
      - name: Build the NSIS installer (per-user)
        working-directory: app/src-tauri
        run: ../ui/node_modules/.bin/tauri build --ci --bundles nsis -- --locked
      - name: Collect the installer and the portable zip
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          $installers = @(Get-ChildItem target/release/bundle/nsis/*-setup.exe)
          if ($installers.Count -ne 1) { throw "expected exactly one NSIS installer, found $($installers.Count)" }
          Copy-Item $installers[0].FullName dist/
          $exe = 'target/release/Redactor.exe'
          if (-not (Test-Path $exe)) { $exe = 'target/release/redactor-app.exe' }
          if (-not (Test-Path $exe)) { throw 'app executable not found in target/release' }
          $name = "Redactor-$env:TAG-windows-x64-portable"
          New-Item -ItemType Directory -Force -Path "stage/$name" | Out-Null
          Copy-Item $exe "stage/$name/Redactor.exe"
          Copy-Item LICENSE, README.md "stage/$name/"
          Compress-Archive -Path "stage/$name" -DestinationPath "dist/$name.zip"
          Get-ChildItem dist
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist-app-windows
          path: dist/
          if-no-files-found: error
          retention-days: 7

  scrub:
    name: scrub (${{ matrix.target }})
    needs: preflight
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: true
      matrix:
        include:
          - target: x86_64-pc-windows-msvc
            os: windows-latest
          # musl: a static binary with no libc dependency, so one file runs on any Linux distribution.
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
          - target: aarch64-apple-darwin
            os: macos-latest
          # Cross-compiled on the arm64 runner: Intel macOS runners are being retired.
          - target: x86_64-apple-darwin
            os: macos-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Toolchain
        env:
          TARGET: ${{ matrix.target }}
        run: |
          rustup show active-toolchain || rustup toolchain install
          rustup target add "$TARGET"
      - name: musl tools
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends musl-tools
      - name: Build
        env:
          TARGET: ${{ matrix.target }}
        run: cargo build --release --locked -p scrub --target "$TARGET"
      - name: Smoke test
        if: matrix.target != 'x86_64-apple-darwin'
        env:
          TARGET: ${{ matrix.target }}
        run: |
          bin="target/$TARGET/release/scrub"
          if [ -f "$bin.exe" ]; then bin="$bin.exe"; fi
          "$bin" version
      - name: Package (tar.gz)
        if: runner.os != 'Windows'
        env:
          TARGET: ${{ matrix.target }}
        run: tools/release/package-scrub.sh "$TAG" "$TARGET" dist
      - name: Package (zip)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          TARGET: ${{ matrix.target }}
        run: |
          $ErrorActionPreference = 'Stop'
          $name = "scrub-$env:TAG-$env:TARGET"
          New-Item -ItemType Directory -Force -Path dist, "stage/$name" | Out-Null
          Copy-Item "target/$env:TARGET/release/scrub.exe" "stage/$name/"
          Copy-Item LICENSE, README.md "stage/$name/"
          Compress-Archive -Path "stage/$name" -DestinationPath "dist/$name.zip"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist-scrub-${{ matrix.target }}
          path: dist/
          if-no-files-found: error
          retention-days: 7

  release:
    name: Draft release
    needs: [app-windows, scrub]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write # create the draft release
      id-token: write # sign the provenance attestations
      attestations: write # store the provenance attestations
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: dist-*
          merge-multiple: true
          path: dist
      - name: SHA256SUMS
        run: |
          tools/release/make-sha256sums.sh dist
          cat dist/SHA256SUMS
      - name: Attest build provenance (every artifact)
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-checksums: dist/SHA256SUMS
      - name: Attest build provenance (SHA256SUMS)
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/SHA256SUMS
      - name: Release notes from CHANGELOG.md
        run: tools/release/changelog-section.sh "$TAG" > release-notes.md
      - name: Create the draft release
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          flags=()
          case "$TAG" in *-*) flags+=(--prerelease) ;; esac
          gh release create "$TAG" dist/* \
            --repo "$REPO" \
            --draft \
            --verify-tag \
            --title "Redactor $TAG" \
            --notes-file release-notes.md \
            "${flags[@]}"
