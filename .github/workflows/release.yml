name: Release

# Releases are built here and nowhere else: never upload a local build (it embeds local paths).
# A tag v* produces a DRAFT release with every artifact, SHA256SUMS and build provenance
# attestations. Publishing the draft is a manual step.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  TAG: ${{ github.ref_name }}
  # RUSTFLAGS is not set here: each build job sets it in its "Path remapping" step, from
  # tools/release/remap-path-flags.sh, so the runner's checkout, cargo home (dependency
  # sources) and rustup home stay out of the binaries. Those paths are only known on the runner.

# No build cache is restored or saved in this workflow: release builds start from a clean slate,
# so a cache written by another ref cannot influence what ships.
jobs:
  preflight:
    name: Preflight
    runs-on: ubuntu-latest
    # Up to 20 minutes waiting for CI, then cargo-deny install and the tests.
    timeout-minutes: 60
    permissions:
      contents: read
      actions: read # read the CI workflow runs for the tagged commit
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Tag is on main
        run: git merge-base --is-ancestor "$GITHUB_SHA" origin/main
      - name: Tag matches the versions in the tree
        run: tools/release/check-version.sh "$TAG"
      - name: CHANGELOG has a section for this version
        run: tools/release/changelog-section.sh "$TAG" > /dev/null
      # The latest CI run for this commit on a push to main must have succeeded. A run still in
      # progress is waited for (up to 20 minutes); no run, or any other conclusion, fails here.
      - name: CI passed for the tagged commit
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          for attempt in $(seq 1 40); do
            run="$(gh api -X GET "repos/$REPO/actions/workflows/ci.yml/runs" \
              -f head_sha="$GITHUB_SHA" -f branch=main -f event=push -f per_page=1 \
              --jq '.workflow_runs[0] // empty | [.status, (.conclusion // "none"), .html_url] | @tsv')"
            if [ -z "$run" ]; then
              echo "::error::no CI run found for $GITHUB_SHA on a push to main"
              exit 1
            fi
            IFS=$'\t' read -r status conclusion url <<< "$run"
            if [ "$status" = completed ]; then
              if [ "$conclusion" = success ]; then
                echo "CI passed for $GITHUB_SHA: $url"
                exit 0
              fi
              echo "::error::CI for $GITHUB_SHA concluded '$conclusion': $url"
              exit 1
            fi
            echo "CI for $GITHUB_SHA is '$status' (check $attempt of 40), waiting: $url"
            sleep 30
          done
          echo "::error::CI for $GITHUB_SHA did not finish within 20 minutes"
          exit 1
      - name: Toolchain
        run: rustup show active-toolchain || rustup toolchain install
      # The app crate needs WebKitGTK on Linux; its tests run in `app-windows` below, and this
      # job already requires the whole CI run (Linux and macOS app jobs included) to be green.
      - name: Tests (Rust workspace)
        run: cargo test --workspace --exclude redactor-app --locked
      # The same dependency policy as CI, re-run here so an advisory published since the last
      # CI run stops the release.
      - name: Install cargo-deny
        run: cargo install --locked --version 0.20.2 cargo-deny
      - name: Dependency policy (Windows graph, includes the Tauri shell)
        run: cargo deny check
      - name: Dependency policy (macOS, includes the Tauri shell)
        run: |
          cargo deny --target aarch64-apple-darwin check
          cargo deny --target x86_64-apple-darwin check
      - name: Dependency policy (Linux, includes the Tauri shell)
        run: cargo deny --target x86_64-unknown-linux-gnu check

  app-windows:
    name: Windows app
    needs: preflight
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      - name: Toolchain
        run: rustup show active-toolchain || rustup toolchain install
      - name: Path remapping
        run: |
          set -euo pipefail
          flags="$(tools/release/remap-path-flags.sh "$GITHUB_WORKSPACE")"
          echo "RUSTFLAGS=$flags" >> "$GITHUB_ENV"
      - name: Build the UI
        working-directory: app/ui
        run: |
          npm ci --no-audit --no-fund
          npm run build
      # The Windows tests run on the commit that ships, with the release flags. The #[ignore]
      # clipboard tests stay ignored: they need a desktop session.
      - name: Tests (Rust workspace, Windows)
        run: cargo test --workspace --locked
      - name: Build the NSIS installer (per-user)
        working-directory: app/src-tauri
        run: ../ui/node_modules/.bin/tauri build --ci --bundles nsis -- --locked
      - name: Collect the installer and the portable zip
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          $installers = @(Get-ChildItem target/release/bundle/nsis/*-setup.exe)
          if ($installers.Count -ne 1) { throw "expected exactly one NSIS installer, found $($installers.Count)" }
          Copy-Item $installers[0].FullName dist/
          $exe = 'target/release/Redactor.exe'
          if (-not (Test-Path $exe)) { $exe = 'target/release/redactor-app.exe' }
          if (-not (Test-Path $exe)) { throw 'app executable not found in target/release' }
          $name = "Redactor-$env:TAG-windows-x64-portable"
          New-Item -ItemType Directory -Force -Path "stage/$name" | Out-Null
          Copy-Item $exe "stage/$name/Redactor.exe"
          Copy-Item LICENSE, THIRD_PARTY_NOTICES.md, README.md "stage/$name/"
          Compress-Archive -Path "stage/$name" -DestinationPath "dist/$name.zip"
          Get-ChildItem dist
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist-app-windows
          path: dist/
          if-no-files-found: error
          retention-days: 7

  scrub:
    name: scrub (${{ matrix.target }})
    needs: preflight
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: true
      matrix:
        include:
          - target: x86_64-pc-windows-msvc
            os: windows-latest
          # musl: a static binary with no libc dependency, so one file runs on any Linux distribution.
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
          - target: aarch64-apple-darwin
            os: macos-latest
          # Cross-compiled on the arm64 runner: Intel macOS runners are being retired.
          - target: x86_64-apple-darwin
            os: macos-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Toolchain
        env:
          TARGET: ${{ matrix.target }}
        run: |
          rustup show active-toolchain || rustup toolchain install
          rustup target add "$TARGET"
      - name: Path remapping
        run: |
          set -euo pipefail
          flags="$(tools/release/remap-path-flags.sh "$GITHUB_WORKSPACE")"
          echo "RUSTFLAGS=$flags" >> "$GITHUB_ENV"
      # No musl-tools: scrub has no C code, and the musl target ships its own C runtime
      # (static-pie, checked locally 2026-11-11), so the release needs no apt mirror.
      - name: Build
        env:
          TARGET: ${{ matrix.target }}
        run: cargo build --release --locked -p scrub --target "$TARGET"
      # Every target runs natively on its runner except x86_64-apple-darwin, which is
      # cross-compiled on the arm64 runner and can only run there under Rosetta 2. When Rosetta
      # is not installed on the runner image, that binary is built but not executed, and the
      # step says so in a notice.
      - name: Smoke test (version, and a made-up secret is redacted)
        env:
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          bin="target/$TARGET/release/scrub"
          if [ -f "$bin.exe" ]; then bin="$bin.exe"; fi
          if [ "$TARGET" = x86_64-apple-darwin ]; then
            if arch -x86_64 /usr/bin/true 2> /dev/null; then
              tools/release/smoke-scrub.sh "$bin" arch -x86_64
            else
              echo "::notice::x86_64-apple-darwin was built but not executed: Rosetta 2 is not available on this arm64 runner"
            fi
          else
            tools/release/smoke-scrub.sh "$bin"
          fi
      - name: Package (tar.gz)
        if: runner.os != 'Windows'
        env:
          TARGET: ${{ matrix.target }}
        run: tools/release/package-scrub.sh "$TAG" "$TARGET" dist
      - name: Package (zip)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          TARGET: ${{ matrix.target }}
        run: |
          $ErrorActionPreference = 'Stop'
          $name = "scrub-$env:TAG-$env:TARGET"
          New-Item -ItemType Directory -Force -Path dist, "stage/$name" | Out-Null
          Copy-Item "target/$env:TARGET/release/scrub.exe" "stage/$name/"
          Copy-Item LICENSE, THIRD_PARTY_NOTICES.md, README.md "stage/$name/"
          Compress-Archive -Path "stage/$name" -DestinationPath "dist/$name.zip"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist-scrub-${{ matrix.target }}
          path: dist/
          if-no-files-found: error
          retention-days: 7

  release:
    name: Draft release
    needs: [app-windows, scrub]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write # create the draft release
      id-token: write # sign the provenance attestations
      attestations: write # store the provenance attestations
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: dist-*
          merge-multiple: true
          path: dist
      - name: SHA256SUMS
        run: |
          tools/release/make-sha256sums.sh dist
          cat dist/SHA256SUMS
      - name: Attest build provenance (every artifact)
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-checksums: dist/SHA256SUMS
      - name: Attest build provenance (SHA256SUMS)
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/SHA256SUMS
      - name: Release notes from CHANGELOG.md
        run: tools/release/changelog-section.sh "$TAG" > release-notes.md
      - name: Create the draft release
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          flags=()
          case "$TAG" in *-*) flags+=(--prerelease) ;; esac
          gh release create "$TAG" dist/* \
            --repo "$REPO" \
            --draft \
            --verify-tag \
            --title "Redactor $TAG" \
            --notes-file release-notes.md \
            "${flags[@]}"
