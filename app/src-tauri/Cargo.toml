[package]
name = "redactor-app"
description = "Redactor desktop app: the Tauri 2 shell around redactor-core (Windows)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lib]
name = "redactor_app"
path = "src/lib.rs"

[[bin]]
name = "redactor-app"
path = "src/main.rs"

# The platform-neutral part (settings, session secrets, the engine bridge, hotkey rules) builds
# and tests everywhere. The Tauri shell itself is Windows-only, so Tauri, its plugins
# and the Win32/WinRT bindings are Windows-only dependencies: Linux CI needs no WebKitGTK.
[dependencies]
redactor-core = { path = "../../crates/redactor-core", features = ["serde"] }
redactor-wire = { path = "../../crates/redactor-wire" }
memchr = "2.7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
unicode-normalization = "0.1"
zeroize = "1.8"

[target.'cfg(windows)'.dependencies]
tauri = { version = "=2.12.5", features = ["isolation", "tray-icon"] }
tauri-plugin-dialog = "=2.8.4"
tauri-plugin-global-shortcut = "=2.4.1"
tauri-plugin-notification = "=2.8.0"
tauri-plugin-single-instance = "=2.5.5"
webview2-com = "0.39"
windows = { version = "0.62", features = [
    "ApplicationModel_DataTransfer",
    "Foundation",
    "Foundation_Collections",
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_System_DataExchange",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_System_Ole",
    "Win32_System_Power",
    "Win32_System_RemoteDesktop",
    "Win32_System_WinRT",
    "Win32_UI_WindowsAndMessaging",
] }

[target.'cfg(windows)'.build-dependencies]
tauri-build = { version = "=2.7.4", features = ["isolation"] }
