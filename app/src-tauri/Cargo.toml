[package]
name = "redactor-app"
description = "Redactor desktop app: the Tauri 2 shell around redactor-core."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lib]
name = "redactor_app"
path = "src/lib.rs"

[[bin]]
name = "redactor-app"
path = "src/main.rs"

# The macOS desktop checks need the main thread's event loop, which the test harness never
# runs. On other systems the binary does nothing.
[[test]]
name = "macos_desktop"
path = "tests/macos_desktop.rs"
harness = false

# The platform-neutral modules (settings, session secrets, the engine bridge, hotkey rules) need
# no desktop. The Tauri shell runs on Windows, macOS and Linux (X11); where `platform::native`
# finds no supported desktop it exits 2 with a pointer to the `scrub` CLI. On Linux it needs
# the WebKitGTK development packages. Each OS's own bindings are in the target sections below.
[dependencies]
redactor-core = { path = "../../crates/redactor-core", features = ["serde"] }
redactor-wire = { path = "../../crates/redactor-wire" }
memchr = "2.7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
unicode-normalization = "0.1"
zeroize = "1.8"
tauri = { version = "=2.12.5", features = ["isolation", "tray-icon"] }
tauri-plugin-dialog = "=2.8.4"
tauri-plugin-global-shortcut = "=2.4.1"
tauri-plugin-notification = "=2.8.0"
tauri-plugin-single-instance = "=2.5.5"

[target.'cfg(windows)'.dependencies]
webview2-com = "0.39"
windows = { version = "0.62", features = [
    "ApplicationModel_DataTransfer",
    "Foundation",
    "Foundation_Collections",
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_System_DataExchange",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_System_Ole",
    "Win32_System_Power",
    "Win32_System_RemoteDesktop",
    "Win32_System_WinRT",
    "Win32_UI_WindowsAndMessaging",
] }

[target.'cfg(target_os = "linux")'.dependencies]
x11rb = { version = "0.13.2", features = ["xfixes"] }
# The version wry builds on; `v2_40` adds no crates and covers every setting `harden_settings`
# changes (WebRTC needs 2.38).
webkit2gtk = { version = "=2.0.2", features = ["v2_40"] }
# The version wry already pulls in: pins GDK to X11 (`platform/linux`), and the WebKitGTK
# desktop test initialises GTK itself.
gtk = "=0.18.2"
# Lock and sleep signals (logind, screen savers) and the tray host check; in the lock through
# the notification plugin.
zbus = "5"
# Only to ask whether the tray's library can be loaded; in the lock through the tray crates.
libloading = "0.7"

# Each is in the lock through Tauri, at exactly this version. Without `default-features = false`
# the AppKit and WebKit bindings would pull in crates that are not.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "=0.6.5"
block2 = "=0.6.2"
dispatch2 = "=0.3.1"
objc2-foundation = { version = "=0.3.2", default-features = false, features = [
    "std", "block2", "NSArray", "NSData", "NSDate", "NSDictionary", "NSDistributedNotificationCenter",
    "NSNotification", "NSObjCRuntime", "NSObject", "NSOperation", "NSRunLoop", "NSString",
    "NSUserDefaults", "NSValue",
] }
objc2-app-kit = { version = "=0.3.2", default-features = false, features = [
    "std", "NSApplication", "NSResponder", "NSView", "NSWindow", "NSPasteboard", "NSWorkspace",
] }
objc2-web-kit = { version = "=0.3.2", default-features = false, features = [
    "std", "objc2-app-kit", "WKWebView", "WKWebViewConfiguration", "WKPreferences", "WKWebsiteDataStore",
] }

[target.'cfg(target_os = "linux")'.dev-dependencies]
# `tests/x11_hotkey.rs` checks the layer the global-shortcut plugin hands the hotkey to.
global-hotkey = "=0.8.0"

[target.'cfg(target_os = "macos")'.dev-dependencies]
# `tests/macos_desktop.rs`: the layer the global-shortcut plugin hands the hotkey to, posted key
# presses, and the activation policy of its own process. All three are in the lock already.
global-hotkey = "=0.8.0"
core-graphics = "=0.25.0"
objc2-app-kit = { version = "=0.3.2", default-features = false, features = ["NSRunningApplication"] }

[build-dependencies]
tauri-build = { version = "=2.7.4", features = ["isolation"] }
