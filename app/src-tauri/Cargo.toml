[package]
name = "redactor-app"
description = "Redactor desktop app: the Tauri 2 shell around redactor-core."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lib]
name = "redactor_app"
path = "src/lib.rs"

[[bin]]
name = "redactor-app"
path = "src/main.rs"

# The platform-neutral modules (settings, session secrets, the engine bridge, hotkey rules) need
# no desktop. The Tauri shell builds on Windows, macOS and Linux; where `platform::native` finds
# no supported desktop it exits 2 with a pointer to the `scrub` CLI. On Linux it needs the
# WebKitGTK development packages. Only the Win32/WinRT bindings are Windows-only dependencies.
[dependencies]
redactor-core = { path = "../../crates/redactor-core", features = ["serde"] }
redactor-wire = { path = "../../crates/redactor-wire" }
memchr = "2.7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
unicode-normalization = "0.1"
zeroize = "1.8"
tauri = { version = "=2.12.5", features = ["isolation", "tray-icon"] }
tauri-plugin-dialog = "=2.8.4"
tauri-plugin-global-shortcut = "=2.4.1"
tauri-plugin-notification = "=2.8.0"
tauri-plugin-single-instance = "=2.5.5"

[target.'cfg(windows)'.dependencies]
webview2-com = "0.39"
windows = { version = "0.62", features = [
    "ApplicationModel_DataTransfer",
    "Foundation",
    "Foundation_Collections",
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_System_DataExchange",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_System_Ole",
    "Win32_System_Power",
    "Win32_System_RemoteDesktop",
    "Win32_System_WinRT",
    "Win32_UI_WindowsAndMessaging",
] }

[target.'cfg(target_os = "linux")'.dependencies]
x11rb = { version = "0.13.2", features = ["xfixes"] }
# The version wry builds on; `v2_40` adds no crates and covers every setting `harden_settings`
# changes (WebRTC needs 2.38).
webkit2gtk = { version = "=2.0.2", features = ["v2_40"] }
# The version wry already pulls in: pins GDK to X11 (`platform/linux`), and the WebKitGTK
# desktop test initialises GTK itself.
gtk = "=0.18.2"
# Lock and sleep signals (logind, screen savers) and the tray host check; in the lock through
# the notification plugin.
zbus = "5"
# Only to ask whether the tray's library can be loaded; in the lock through the tray crates.
libloading = "0.7"

[target.'cfg(target_os = "linux")'.dev-dependencies]
# `tests/x11_hotkey.rs` checks the layer the global-shortcut plugin hands the hotkey to.
global-hotkey = "=0.8.0"

[build-dependencies]
tauri-build = { version = "=2.7.4", features = ["isolation"] }
