# Example Redactor configuration for `scrub`.
#
# Copy this file to `redactor.toml` or `.redactor.toml`. scrub looks for it in the working
# directory, then in each parent folder, and stops at the repository root (the first folder with a
# `.git`) or your home folder. It prints the path of the file it loads. `--config FILE` names one
# directly. The tool works with no config at all: every setting is optional, and every line
# below is commented out, so delete the `#` only where you want a change.
#
# A config file can lower detection, so scrub treats it with care: on Linux and macOS it
# refuses a file that every user can write to or that another user owns, and `scrub check`
# prints every allowlist entry, disabled rule and custom template on each run.

# How hard to look. "relaxed" reports fewer, "paranoid" more. Default: "balanced".
# sensitivity = "balanced"

# Also redact personal data: email, phone numbers, IBAN, credit card numbers, IPv4 and IPv6
# addresses and US social security numbers. Off by default, because such data is often a
# legitimate part of the text.
# pii = true

# Remove zero-width, bidirectional and tag characters from the output. Default: true.
# strip_invisible = true

# Words that are always redacted (whole words, any case): names, host names, project codes.
# terms = ["Contoso", "build-server-04"]

# "labeled" gives [REDACTED: Password]; "generic" gives [REDACTED: Secret] for everything.
# placeholder = "labeled"

# Your own placeholder text. {label} is the kind of secret and {suffix} is the number
# (" #2"), empty when that kind appears only once. Text that looks like your template is not
# redacted again, so `scrub check` warns when you set one.
# template = "[REDACTED: {label}{suffix}]"

# Turn rules off by id (`scrub detectors` lists them).
# disabled = ["us_ssn"]

# Turn on rules that ship switched off. A rule in `disabled` still stays off.
# enabled = []

# Values that are left alone: regular expressions, tested against each value that was found.
# Keep them narrow. scrub refuses an entry that would let everything through, such as `.*`,
# an empty pattern or a bare provider prefix.
# allowlist = [
#     "^db\\.internal\\.example\\.net$",
#     "^Tulip-Harbor-91$",   # a made-up value your docs use on purpose
# ]

# Your own rules. `pattern` is a regular expression; `group` (default 0) picks the capture group
# that is the secret, so the text around it stays. `confidence` defaults to 0.9.
# [[custom_rules]]
# id = "acme_internal_token"
# label = "ACME Internal Token"
# pattern = "\\bACME-[A-Z0-9]{20}\\b"
# confidence = 0.95
# group = 0
