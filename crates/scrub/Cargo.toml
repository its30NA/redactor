[package]
name = "scrub"
description = "Command-line front end for redactor: redact secrets from files, stdin, git commits and the clipboard."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lib]
name = "scrub"
path = "src/lib.rs"

[[bin]]
name = "scrub"
path = "src/main.rs"

[dependencies]
redactor-core = { path = "../redactor-core", features = ["serde"] }
redactor-wire = { path = "../redactor-wire" }
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
similar = "2"
toml = "1"
regex = "1.11"

[target.'cfg(unix)'.dependencies]
rustix = { version = "1", features = ["process"] }

# Already in the tree through tauri-build; only Windows hosts build it.
[target.'cfg(windows)'.build-dependencies]
tauri-winres = "0.3"

[dev-dependencies]
assert_cmd = "2"
tempfile = "3"
