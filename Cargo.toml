[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "2.0.0"
edition = "2021"
rust-version = "1.99"
license = "MIT"
repository = "https://github.com/its30NA/redactor"

[profile.release]
codegen-units = 1
lto = "thin"
# A panic aborts; the app installs a hook that prints nothing about content.
panic = "abort"
