# cargo-deny policy: licenses, advisories, bans, sources.
# Run with `cargo deny check` (CI does, on every push and pull request).

[graph]
# The default run checks the Windows graph, the one that ships today. CI (and the release
# preflight) run the same policy for the macOS and Linux graphs with `--target`, Tauri shell
# included (see .github/workflows/ci.yml). The Linux graph needs the ISC licence and the
# advisory exceptions below, all inside Tauri's GTK3/D-Bus stack.
targets = ["x86_64-pc-windows-msvc"]

[advisories]
# Every advisory is an error: vulnerabilities, unmaintained and unsound crates, yanked releases.
# Fixing an advisory means updating or replacing the crate; an `ignore` entry needs a reason
# and an expiry note in the same line.
yanked = "deny"
unmaintained = "all"
unsound = "all"
# Linux only, all inside Tauri's GTK3/D-Bus stack; accepted 2026-11-12 and named in the
# THREAT_MODEL at the first macOS/Linux release.
ignore = [
    { id = "RUSTSEC-2024-0429", reason = "glib 0.18 VariantStrIter unsound, fixed in 0.20; Tauri's GTK3 stack pins 0.18 and Redactor never calls it. Re-check at every Tauri update and before every release." },
    { id = "RUSTSEC-2024-0370", reason = "proc-macro-error unmaintained, a build-time macro of glib 0.18 (GTK3 stack), no runtime code. Re-check at every Tauri update and before every release." },
    { id = "RUSTSEC-2026-0370", reason = "zvariant unmaintained (merged into zbus 6); the Tauri notification and single-instance plugins still use zbus 5. Re-check at every Tauri update and before every release." },
    { id = "RUSTSEC-2026-0371", reason = "zbus_names unmaintained (merged into zbus 6); the Tauri notification and single-instance plugins still use zbus 5. Re-check at every Tauri update and before every release." },
    { id = "RUSTSEC-2026-0372", reason = "zvariant_derive unmaintained (merged into zbus 6); the Tauri notification and single-instance plugins still use zbus 5. Re-check at every Tauri update and before every release." },
]

[licenses]
# Permissive licenses only. Anything not listed here (including every copyleft license) fails.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-3-Clause",
    "Unicode-3.0",
    "Zlib",
    "CC0-1.0",
    "MPL-2.0",
    "Unlicense",
    "0BSD",
    "MIT-0",
    # Linux only: libloading 0.7.4, via the tray (tray-icon -> libappindicator). Permissive.
    "ISC",
]
confidence-threshold = 0.9

[bans]
multiple-versions = "allow"
wildcards = "deny"
allow-wildcard-paths = true
highlight = "all"

# Redactor makes no network connections. These crates would be the way to add one, so they
# fail the build if they ever enter the graph.
deny = [
    { crate = "reqwest", reason = "no network code: HTTP client" },
    { crate = "hyper", reason = "no network code: HTTP client and server" },
    { crate = "hyper-util", reason = "no network code: HTTP client and server" },
    { crate = "h2", reason = "no network code: HTTP/2" },
    { crate = "ureq", reason = "no network code: HTTP client" },
    { crate = "curl", reason = "no network code: libcurl bindings" },
    { crate = "curl-sys", reason = "no network code: libcurl bindings" },
    { crate = "isahc", reason = "no network code: HTTP client" },
    { crate = "attohttpc", reason = "no network code: HTTP client" },
    { crate = "surf", reason = "no network code: HTTP client" },
    { crate = "minreq", reason = "no network code: HTTP client" },
    { crate = "tungstenite", reason = "no network code: WebSocket" },
    { crate = "tokio-tungstenite", reason = "no network code: WebSocket" },
]

[sources]
# crates.io is the only source: no git dependencies, no other registries.
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
